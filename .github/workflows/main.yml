name: Main

on:
  push:
    branches: [master]
    tags: ['**']
    paths-ignore:
      - docs/**
      - README.md
      - LICENSE
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WEAVIATE_128: 1.28.16
  WEAVIATE_132: 1.32.23
  WEAVIATE_135: 1.35.0
  MIX_ENV: test

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.18'
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix compile --warnings-as-errors

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.18'
      - name: Cache deps and PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-
      - run: mix deps.get
      - run: mkdir -p priv/plts
      - run: mix dialyzer --plt
      - run: mix dialyzer

  unit-tests:
    name: Unit Tests (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '26.0'
            elixir: '1.16'
          - otp: '26.0'
            elixir: '1.17'
          - otp: '27.0'
            elixir: '1.17'
          - otp: '27.0'
            elixir: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-
      - run: mix deps.get
      - run: mix test --cover
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.otp == '27.0' && matrix.elixir == '1.18'
        with:
          name: coverage-report
          path: cover/

  integration-tests:
    name: Integration Tests (Weaviate ${{ matrix.weaviate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        weaviate: ['1.28.16', '1.32.23', '1.35.0']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.18'
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: ${{ !github.event.pull_request.head.repo.fork && github.triggering_actor != 'dependabot[bot]' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-integration-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-integration-
      - run: mix deps.get
      - name: Start Weaviate
        run: ./ci/start_weaviate.sh ${{ matrix.weaviate }}
      - name: Run integration tests
        run: mix test --only integration
        env:
          WEAVIATE_INTEGRATION: "true"
          WEAVIATE_URL: http://localhost:8080
      - name: Stop Weaviate
        if: always()
        run: ./ci/stop_weaviate.sh

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.18'
      - run: mix deps.get
      - run: mix docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: doc/

  publish:
    name: Publish to Hex.pm
    needs: [lint-and-format, dialyzer, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.18'
      - run: mix deps.get
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  gh-release:
    name: GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: doc/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
