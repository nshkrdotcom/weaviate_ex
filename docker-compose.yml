services:
  weaviate:
    # Updated to 1.28.14 for Object TTL and other new features
    # Note: 1.35+ required for full Object TTL support when available
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.14
    ports:
      - "8080:8080"
      - "40051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
      # Enable gRPC for better performance
      ENABLE_GRPC: 'true'
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  weaviate_data:
    driver: local
